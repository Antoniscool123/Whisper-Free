name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build EXE
        run: pyinstaller --clean --noconfirm WhisperFree.spec
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperFree-Windows
          path: dist/WhisperFree.exe
      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Whisper Free latest build
          prerelease: true
          files: dist/WhisperFree.exe
